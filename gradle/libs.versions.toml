[versions]
# Kotlin 2.2.0 + Xcode 26.5 verified working on this Mac (2026-09-27).
kotlin = "2.2.0"
agp = "8.7.3"
composeMultiplatform = "1.9.0"

compileSdk = "36"
minSdk = "24"
targetSdk = "36"

androidxActivityCompose = "1.10.1"
androidxCore = "1.16.0"
androidxLifecycle = "2.9.1"
coroutines = "1.10.2"
serialization = "1.8.1"
ktor = "3.2.3"
koin = "4.1.1"
navigationCompose = "2.9.2"
multiplatformSettings = "1.3.0"
compottie = "2.0.2"
# Room KMP. 2.7.x klibs are built with Kotlin 2.1.10 (fine for our 2.2.0);
# 2.8.x is 2.2.0. Both publish iosX64 - on Google Maven, not Maven Central.
room = "2.7.2"
sqlite = "2.5.2"
ksp = "2.2.0-2.0.2"

# Receipt scanner, Android half. Same versions the old app shipped: CameraX
# 1.4.2 is also the release that fixed the 16 KB page-size requirement, so do
# not drop below it. Both are Android-only - iOS uses the Vision framework,
# which ships with the OS and needs no dependency, so neither of these has to
# clear the iosX64 / Kotlin-version klib gate.
cameraX = "1.4.2"
mlkitTextRecognition = "16.0.1"
coroutinesPlayServices = "1.10.2"

[libraries]
# --- shared (business logic, no UI) ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# --- Room (shared local database) ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# --- DI + navigation + key-value storage (shared foundation) ---
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-android = { module = "io.insert-koin:koin-android" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }

# Lottie renderer for Compose Multiplatform (replaces the Android Lottie lib)
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compottie-resources = { module = "io.github.alexzhirkevich:compottie-resources", version.ref = "compottie" }

# --- receipt scanner (Android only) ---
# On-device OCR: reads the photo locally, free and offline, then the shared
# ReceiptTextParser sends the resulting text to Groq.
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
# Gives ML Kit's Task an `await()`.
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }

# --- composeApp (UI) ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
# NotificationCompat for the voice bubble's foreground-service notification.
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
